<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDM 區塊編輯器</title>
  <style>
    @font-face {
      font-family: 'BrandBold';
      src: url('./fonts/ShopeeNotoSans(content)-Bold.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'BrandMedium';
      src: url('./fonts/ShopeeNotoSans(content)-Medium.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --toolbar-w: 286px;
      --canvas-w: 1200px;
      --page-bg: #edf1f5;
      --button-orange: #f1582c;
      --section-1: #aa0c09;
      --section-2: #f8b551;
      --section-3: #4074c0;
      --section-4: #143765;
      --text-light: #ffffff;
      --panel-bg: #f3f3f3;
      --stage-shadow: none;
      --title-size: 46.43px;
      --button-size: 35.8px;
      --date-size: 37.15px;
      --copy-size: 37.15px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page-bg);
      color: #1f2f46;
      font-family: 'BrandMedium', 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    }

    .app {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      gap: 24px;
      padding: 24px;
    }

    .toolbar {
      position: sticky;
      top: 24px;
      width: var(--toolbar-w);
      background: #ffffff;
      border-radius: 22px;
      box-shadow: none;
      padding: 22px;
    }

    .toolbar h1 {
      margin: 0 0 6px;
      font-family: 'BrandBold', 'PingFang TC', 'Noto Sans TC', sans-serif;
      font-size: 28px;
      line-height: 1.15;
      color: #122946;
    }

    .toolbar p {
      margin: 0 0 18px;
      color: #5c6a79;
      font-size: 14px;
      line-height: 1.6;
    }

    .tool-btn,
    .file-trigger {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      margin: 0 0 12px;
      background: #122946;
      color: #fff;
      cursor: pointer;
      font-family: 'BrandMedium', 'PingFang TC', 'Noto Sans TC', sans-serif;
      font-size: 16px;
      transition: transform .16s ease, opacity .16s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .tool-btn:hover,
    .file-trigger:hover { transform: translateY(-1px); }
    .tool-btn.secondary { background: var(--button-orange); }
    .tool-btn.ghost { background: #eef3f8; color: #16304f; }

    #workbookInput { display: none; }

    .status {
      margin-top: 10px;
      border-radius: 14px;
      padding: 12px 14px;
      background: #f6f8fb;
      color: #506074;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-line;
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .swatch {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #617285;
    }

    .swatch i {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      display: inline-block;
    }

    .workspace {
      flex: 1;
      overflow: auto;
      padding-bottom: 40px;
    }

    .stage-wrap {
      min-width: calc(var(--canvas-w) + 40px);
      padding: 6px 0 30px;
    }

    .stage {
      width: var(--canvas-w);
      background: #ffffff;
      box-shadow: none;
      overflow: hidden;
    }

    .section {
      width: 100%;
      margin: 0 0 12px;
      background: var(--frame-color, transparent);
      padding: 10px;
      border: 0;
      overflow: hidden;
      background-clip: padding-box;
    }
    .section:last-child { margin-bottom: 0; }

    .section-header {
      min-height: 94px;
      padding: 14px 28px 14px 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: #fff;
      margin: 0;
      border: 0;
    }

    .section-title {
      flex: 1;
      min-width: 0;
      outline: none;
      font-family: 'BrandBold', 'PingFang TC', 'Noto Sans TC', sans-serif;
      font-size: var(--title-size);
      line-height: 1.08;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      position: relative;
      top: -5px;
    }

    .share-btn {
      flex: 0 0 auto;
      width: 230px;
      min-height: 54px;
      padding: 0 18px 0 28px;
      background: var(--button-orange);
      border-radius: 10px;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .share-btn-text {
      outline: none;
      font-family: 'BrandMedium', 'PingFang TC', 'Noto Sans TC', sans-serif;
      font-size: var(--button-size);
      line-height: 1;
      white-space: nowrap;
      display: flex;
      align-items: center;
      position: relative;
      top: 0px;
    }

    .share-arrow {
      width: 0;
      height: 0;
      border-top: 12.5px solid transparent;
      border-bottom: 12.5px solid transparent;
      border-left: 15px solid #ffffff;
      flex: 0 0 auto;
    }

    .section-body {
      margin: 0;
      padding: 18px 22px 20px;
      background: #ffffff;
      border: 0;
    }

    .item {
      position: relative;
      display: flex;
      align-items: stretch;
      gap: 18px;
      min-height: 50px;
      margin-bottom: 10px;
      padding: 0;
    }
    .item:last-child { margin-bottom: 0; }

    .item-copy-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      padding: 0 0;
      border-radius: 0 12px 12px 0;
      background: transparent;
      position: relative;
    }

    .pill {
      flex: 0 0 auto;
      min-width: 0;
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      color: #fff;
      outline: none;
      font-family: 'BrandMedium', 'PingFang TC', 'Noto Sans TC', sans-serif;
      font-size: var(--date-size);
      line-height: 1;
      white-space: nowrap;
      border-radius: 0 999px 999px 0;
      position: relative;
      vertical-align: middle;
      transform: translateY(-3px);
    }

    .pill-text {
      display: block;
      position: relative;
      top: -2px;
      line-height: 1;
    }

    body.exporting .pill-text {
      top: -3px;
    }

    .copy {
      flex: 1;
      min-width: 0;
      outline: none;
      font-family: 'BrandMedium', 'PingFang TC', 'Noto Sans TC', sans-serif;
      font-size: var(--copy-size);
      line-height: 1.12;
      word-break: break-word;
      padding: 0 8px 0 0;
      display: flex;
      align-items: center;
      position: relative;
      top: -5px;
    }

    .editable:focus {
      box-shadow: none;
      background: transparent;
      border-radius: 8px;
    }
    .pill.editable:focus,
    .ig-mini-pill.editable:focus {
      border-radius: 999px;
    }
    .section-body .editable:focus { background: transparent; }

    .empty-state {
      padding: 60px 30px;
      text-align: center;
      color: #6b7d90;
      font-size: 18px;
      line-height: 1.7;
    }


    .ig-preview-wrap {
      min-width: calc(var(--canvas-w) + 40px);
      padding: 24px 0 40px;
    }

    .ig-preview-title {
      width: 1000px;
      margin: 0 0 16px;
      font-family: 'BrandBold', 'PingFang TC', 'Noto Sans TC', sans-serif;
      font-size: 28px;
      line-height: 1.2;
      color: #122946;
    }

    .ig-preview-grid {
      display: grid;
      gap: 30px;
    }

    .ig-page {
      width: 1000px;
      height: 1000px;
      background: #f8e8d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      box-shadow: none;
      position: relative;
      border: 0;
    }

    .ig-page-name {
      width: 100%;
      padding: 16px 20px 0;
      font-family: 'BrandBold', 'PingFang TC', 'Noto Sans TC', sans-serif;
      font-size: 24px;
      line-height: 1.2;
      color: #122946;
    }

    .ig-title-wrap {
      width: 100%;
      padding-top: 68px;
      display: flex;
      justify-content: center;
    }

    .ig-title {
      margin: 0;
      max-width: calc(1000px - 80px);
      min-height: 78px;
      padding: 0 50px;
      border-radius: 999px;
      background: #ee4d2d;
      color: #fff;
      font-family: 'BrandBold', 'PingFang TC', 'Noto Sans TC', sans-serif;
      font-size: 48px;
      line-height: 1.15;
      text-align: center;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      top: -5px;
    }

    .ig-section-block {
      width: 845px;
      height: 675px;
      background: transparent;
      padding: 0;
      margin-top: 32px;
      margin-bottom: 34px;
      display: flex;
      align-items: flex-start;
      flex: 0 0 auto;
      min-height: 0;
    }

    .ig-mini-stack {
      width: 845px;
      height: 100%;
      display: grid;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 14px;
      min-height: 0;
    }

    .ig-mini-section {
      background: var(--frame-color, transparent);
      padding: 8px;
      border: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      background-clip: padding-box;
    }

    .ig-mini-header {
      min-height: 74px;
      padding: 11px 18px 11px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: #fff;
      margin: 0;
      border: 0;
    }

    .ig-mini-title {
      flex: 1;
      min-width: 0;
      font-family: 'BrandBold', 'PingFang TC', 'Noto Sans TC', sans-serif;
      font-size: 50px;
      line-height: 1.05;
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      position: relative;
      top: -5px;
    }

    .ig-mini-btn {
      flex: 0 0 auto;
      min-width: 166px;
      min-height: 42px;
      padding: 0 14px 0 18px;
      background: var(--button-orange);
      border-radius: 8px;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .ig-mini-btn-text {
      font-family: 'BrandMedium', 'PingFang TC', 'Noto Sans TC', sans-serif;
      font-size: 26px;
      line-height: 1;
      white-space: nowrap;
      display: flex;
      align-items: center;
      position: relative;
      top: -1px;
    }

    .ig-mini-arrow {
      width: 0;
      height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-left: 10px solid #ffffff;
      flex: 0 0 auto;
    }

    .ig-mini-body {
      padding: 12px 14px 14px;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      flex: 1 1 auto;
      min-height: 0;
      margin: 0;
      border: 0;
    }

    .ig-mini-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ig-mini-pill {
      flex: 0 0 auto;
      height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      color: #fff;
      font-family: 'BrandMedium', 'PingFang TC', 'Noto Sans TC', sans-serif;
      font-size: 36px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      position: relative;
      transform: none;
      overflow: hidden;
    }

    .ig-mini-pill-text {
      display: block;
      position: relative;
      top: -2px;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }

    body.exporting .ig-mini-pill {
      transform: none;
    }

    body.exporting .ig-mini-pill-text {
      top: -2px;
    }

    .ig-mini-copy {
      flex: 1;
      min-width: 0;
      background: #fff;
      font-family: 'BrandMedium', 'PingFang TC', 'Noto Sans TC', sans-serif;
      font-size: 35px;
      line-height: 1.12;
      display: flex;
      align-items: center;
      word-break: break-word;
      position: relative;
      top: -5px;
    }

    
    .ig-footer {
      position: absolute;
      top: 900px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .ig-footer img {
      width: 100%;
      height: auto;
      display: block;
    }

@media (max-width: 1600px) {
      .app { align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="toolbar">
      <h1>EDM HTML 編輯器</h1>
      <p>左側上傳工單，右側即時生成 1200px 畫布。標題、日期、內文、按鈕文字都可直接點擊編輯。</p>

      <label class="file-trigger" for="workbookInput">上傳工單 Excel</label>
      <input id="workbookInput" type="file" accept=".xlsx,.xls" />

      <button id="downloadBtn" class="tool-btn secondary" type="button">下載圖片</button>
      <button id="rerenderBtn" class="tool-btn ghost" type="button">重整版面</button>

      <div class="status" id="statusBox">已載入範例工單資料。
如需套新工單，請直接上傳 Excel。</div>

      <div class="swatches">
        <div class="swatch"><i style="background:#aa0c09"></i><span>#aa0c09</span></div>
        <div class="swatch"><i style="background:#f8b551"></i><span>#f8b551</span></div>
        <div class="swatch"><i style="background:#4074c0"></i><span>#4074c0</span></div>
        <div class="swatch"><i style="background:#143765"></i><span>#143765</span></div>
      </div>
    </aside>

    <main class="workspace">
      <div class="stage-wrap">
        <div id="stage" class="stage"></div>
      </div>
      <div class="ig-preview-wrap">
        <div class="ig-preview-title">IG 版位預覽</div>
        <div id="igPreview" class="ig-preview-grid"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    const stage = document.getElementById('stage');
    const igPreview = document.getElementById('igPreview');
    const statusBox = document.getElementById('statusBox');
    const workbookInput = document.getElementById('workbookInput');
    const downloadBtn = document.getElementById('downloadBtn');
    const rerenderBtn = document.getElementById('rerenderBtn');

    let currentData = structuredClone(INITIAL_DATA);

    function escapeHtml(text) {
      return String(text ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function normalizeValue(value) {
      if (value === null || value === undefined) return '';
      if (typeof value === 'number' && Number.isFinite(value)) return String(value);
      return String(value).replace(/\s+/g, ' ').trim();
    }

    function cleanButtonText(value) {
      return normalizeValue(value).replace(/[▶►▸→]+/g, '').trim() || DEFAULT_BUTTON;
    }

    function parseDateAndText(raw) {
      const value = normalizeValue(raw);
      const match = value.match(/^\s*(\d{1,2}\/\d{1,2}(?:\s*[-–~]\s*(?:\d{1,2}\/)?\d{1,2})?)\s*(?:[|｜]\s*)?(.*)$/);
      if (!match) return null;
      return {
        date: match[1].replace(/\s+/g, ' ').trim(),
        text: match[2].trim()
      };
    }

    function parseWorksheetRows(rows) {
      const anchorIndex = rows.findIndex(row => normalizeValue(row[10]) === '本月精選活動');
      if (anchorIndex === -1) throw new Error('找不到 K 欄的「本月精選活動」基準點。');

      const sections = [];
      let currentSection = null;

      for (let i = anchorIndex + 1; i < rows.length; i += 1) {
        const row = rows[i] || [];
        const k = normalizeValue(row[10]);
        const m = normalizeValue(row[12]);
        if (!k && !m) continue;

        const parsed = parseDateAndText(k);
        const isCategoryRow = !!k && !!m && m.includes('開始分享') && !parsed;

        if (isCategoryRow) {
          currentSection = { title: k, button: cleanButtonText(m), items: [] };
          sections.push(currentSection);
          continue;
        }

        if (parsed && currentSection) currentSection.items.push(parsed);
      }

      if (!sections.length) throw new Error('有找到基準點，但沒有解析到任何類別區塊。');
      return sections;
    }

    function normalizePillWidths() {
      document.querySelectorAll('.section').forEach(section => {
        normalizePillWidthsForSection(section);
      });
    }

    function normalizePillWidthsForSection(section) {
      if (!section) return;
      const pills = Array.from(section.querySelectorAll('.pill'));
      if (!pills.length) return;
      let max = 0;
      pills.forEach(pill => {
        pill.style.width = 'auto';
        max = Math.max(max, Math.ceil(pill.getBoundingClientRect().width));
      });
      pills.forEach(pill => {
        pill.style.width = `${max}px`;
      });
    }

    function bindLivePillWidthSync() {
      stage.querySelectorAll('.pill').forEach(pill => {
        pill.addEventListener('input', () => {
          const section = pill.closest('.section');
          normalizePillWidthsForSection(section);
        });
      });
    }


    function getCurrentStageData() {
      const sections = Array.from(stage.querySelectorAll('.section'));
      if (!sections.length) return structuredClone(currentData);

      return sections.map(section => ({
        title: (section.querySelector('.section-title')?.textContent || '').trim(),
        button: cleanButtonText(section.querySelector('.share-btn-text')?.textContent || DEFAULT_BUTTON),
        items: Array.from(section.querySelectorAll('.item')).map(item => ({
          date: (item.querySelector('.pill')?.textContent || '').trim(),
          text: (item.querySelector('.copy')?.textContent || '').trim()
        })).filter(item => item.date || item.text)
      }));
    }

    function normalizeMiniPillWidths() {
      igPreview.querySelectorAll('.ig-mini-section').forEach(section => {
        const pills = Array.from(section.querySelectorAll('.ig-mini-pill'));
        if (!pills.length) return;
        let max = 0;
        pills.forEach(pill => {
          pill.style.width = 'auto';
          max = Math.max(max, Math.ceil(pill.getBoundingClientRect().width));
        });
        pills.forEach(pill => {
          pill.style.width = `${max}px`;
        });
      });
    }

    function buildIgMiniSection(section, color) {
      const itemsHtml = (section.items || []).map(item => `
        <div class="ig-mini-item">
          <div class="ig-mini-pill" style="background:${color};"><span class="ig-mini-pill-text">${escapeHtml(item.date || '')}</span></div>
          <div class="ig-mini-copy" style="color:${color};">${escapeHtml(item.text || '')}</div>
        </div>
      `).join('');

      return `
        <section class="ig-mini-section" style="--frame-color:${color};">
          <div class="ig-mini-header" style="background:${color};">
            <div class="ig-mini-title">${escapeHtml(section.title || '')}</div>
            <div class="ig-mini-btn">
              <div class="ig-mini-btn-text">${escapeHtml(cleanButtonText(section.button || DEFAULT_BUTTON))}</div>
              <span class="ig-mini-arrow" aria-hidden="true"></span>
            </div>
          </div>
          <div class="ig-mini-body">${itemsHtml}</div>
        </section>
      `;
    }

    function buildIgPage(label, sections, baseIndex) {
      const body = sections.map((section, offset) => buildIgMiniSection(section, COLORS[(baseIndex + offset) % COLORS.length])).join('');
      return `
        <section class="ig-page">
          <div class="ig-page-name"></div>
          <div class="ig-title-wrap">
            <h2 class="ig-title">本月精選活動</h2>
          </div>
          <div class="ig-section-block">
            <div class="ig-mini-stack">${body}</div>
          </div>
          <div class="ig-footer">
            <img src="${BOTTOM_IMAGE_DATA_URL}" />
          </div>
        </section>
      `;
    }

    function renderIgPreviews(sourceData) {
      const data = Array.isArray(sourceData) && sourceData.length ? sourceData : structuredClone(currentData);
      const pages = [];
      if (data.slice(0, 2).length) pages.push(buildIgPage('ig1', data.slice(0, 2), 0));
      if (data.slice(2, 4).length) pages.push(buildIgPage('ig2', data.slice(2, 4), 2));
      igPreview.innerHTML = pages.join('');
      requestAnimationFrame(normalizeMiniPillWidths);
    }

    function render(data) {
      if (!Array.isArray(data) || !data.length) {
        stage.innerHTML = '<div class="empty-state">目前沒有可呈現的區塊資料。</div>';
        renderIgPreviews(structuredClone(currentData));
        return;
      }

      const html = data.map((section, sectionIndex) => {
        const color = COLORS[sectionIndex % COLORS.length];
        const itemHtml = (section.items || []).map(item => `
          <div class="item" data-item-index="${sectionIndex}">
            <div class="pill editable" contenteditable="true" spellcheck="false" style="background:${color};"><span class="pill-text">${escapeHtml(item.date)}</span></div>
            <div class="item-copy-wrap">
              <div class="copy editable" contenteditable="true" spellcheck="false" style="color:${color};">${escapeHtml(item.text)}</div>
            </div>
          </div>
        `).join('');

        return `
          <section class="section" data-section-index="${sectionIndex}" style="--frame-color:${color};">
            <div class="section-header" style="background:${color};">
              <div class="section-title editable" contenteditable="true" spellcheck="false">${escapeHtml(section.title)}</div>
              <div class="share-btn">
                <div class="share-btn-text editable" contenteditable="true" spellcheck="false">${escapeHtml(cleanButtonText(section.button || DEFAULT_BUTTON))}</div>
                <span class="share-arrow" aria-hidden="true"></span>
              </div>
            </div>
            <div class="section-body">
              ${itemHtml}
            </div>
          </section>
        `;
      }).join('');

      stage.innerHTML = html;
      requestAnimationFrame(() => {
        normalizePillWidths();
        bindLivePillWidthSync();
        renderIgPreviews(getCurrentStageData());
      });
    }

    async function handleWorkbook(file) {
      if (!file) return;
      statusBox.textContent = '讀取中…';
      try {
        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        currentData = parseWorksheetRows(rows);
        render(currentData);
renderIgPreviews(currentData);
        statusBox.textContent = `已匯入：${file.name}\n工作表：${sheetName}\n共解析 ${currentData.length} 個類別區塊。`;
      } catch (error) {
        console.error(error);
        statusBox.textContent = `匯入失敗：${error.message}`;
      }
    }

    function triggerDownloadBlob(blob, filename) {
      const link = document.createElement('a');
      link.download = filename;
      link.href = URL.createObjectURL(blob);
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }

    async function canvasToBlob(canvas) {
      return await new Promise((resolve, reject) => {
        canvas.toBlob(blob => {
          if (blob) resolve(blob);
          else reject(new Error('圖片轉檔失敗'));
        }, 'image/png');
      });
    }

    async function downloadAsImage() {
      statusBox.textContent = '正在輸出圖片…';
      const originalStageShadow = stage.style.boxShadow;
      try {
        const now = Date.now();

        function triggerDownload(dataUrl, filename) {
          const a = document.createElement('a');
          a.href = dataUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
        }

        function wait(ms) {
          return new Promise(resolve => setTimeout(resolve, ms));
        }

        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }
        await wait(120);

        stage.style.boxShadow = 'none';
        document.body.classList.add('exporting');

        const edmCanvas = await html2canvas(stage, {
          useCORS: true,
          backgroundColor: '#ffffff',
          scale: 2,
          width: stage.clientWidth,
          height: stage.scrollHeight,
          windowWidth: stage.clientWidth,
          windowHeight: stage.scrollHeight
        });
        triggerDownload(edmCanvas.toDataURL('image/png', 1.0), `edm-${now}.png`);
        await wait(500);

        const igPages = Array.from(document.querySelectorAll('.ig-page'));
        for (let i = 0; i < igPages.length; i += 1) {
          const page = igPages[i];
          const originalPageShadow = page.style.boxShadow;
          page.style.boxShadow = 'none';
          await wait(80);
          const rect = page.getBoundingClientRect();
          const igCanvas = await html2canvas(page, {
            useCORS: true,
            backgroundColor: '#f8e8d9',
            scale: 2,
            width: Math.ceil(rect.width),
            height: Math.ceil(rect.height),
            windowWidth: Math.ceil(rect.width),
            windowHeight: Math.ceil(rect.height)
          });
          page.style.boxShadow = originalPageShadow;
          triggerDownload(igCanvas.toDataURL('image/png', 1.0), `ig-${i + 1}-${now}.png`);
          await wait(500);
        }

        statusBox.textContent = '三張圖片已下載完成。';
      } catch (error) {
        console.error(error);
        statusBox.textContent = `下載失敗：${error.message}`;
      } finally {
        document.body.classList.remove('exporting');
        stage.style.boxShadow = originalStageShadow;
      }
    }

    workbookInput.addEventListener('change', event => {
      const [file] = event.target.files || [];
      handleWorkbook(file);
      event.target.value = '';
    });

    stage.addEventListener('input', event => {
      if (!event.target.classList.contains('editable')) return;
      if (event.target.classList.contains('pill')) {
        normalizePillWidthsForSection(event.target.closest('.section'));
      }
      renderIgPreviews(getCurrentStageData());
    });

    downloadBtn.addEventListener('click', downloadAsImage);
    rerenderBtn.addEventListener('click', () => render(currentData));

    render(currentData);
renderIgPreviews(currentData);
    </script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</body>
</html>
