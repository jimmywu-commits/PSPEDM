<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>更多精選商品｜自動套版</title>

<!-- 已移除 Google Noto Sans TC 相關 link -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">

<style>
  /* 本機同層字型：./fonts/ShopeeNotoSans(content)-*.ttf */
  @font-face{
    font-family:"SN-Bold";
    src:url("./fonts/ShopeeNotoSans(content)-Bold.ttf") format("truetype");
    font-weight:700;font-style:normal;font-display:swap;
  }
  @font-face{
    font-family:"SN-Medium";
    src:url("./fonts/ShopeeNotoSans(content)-Medium.ttf") format("truetype");
    font-weight:500;font-style:normal;font-display:swap;
  }
  @font-face{
    font-family:"SN-Regular";
    src:url("./fonts/ShopeeNotoSans(content)-Regular.ttf") format("truetype");
    font-weight:400;font-style:normal;font-display:swap;
  }

  :root{
    --bg:#ffbd83;
    --accent:#ff6b45;
    --text:#2b1908;
    --highlight:#e3342f;
    --page-width:1000px;
    --page-bg:#f8e8d9;
    --section-width:846px;
    --card-width:377px;
    --card-height:244px;
    --side-gap:17px;
    --card-gap-x:17px;
    --card-gap-y:17px;
    --section-pad-y:17px;
    --meta-gap-top:17px;
    --meta-gap-bottom:0px;
    --font-size-main:30px;
    --ig-scale:0.705;
    --ig-title-top-gap:69px;
    --ig-title-bottom-gap:32px;
    --ig-footer-gap-top:15px;
    --ig-footer-gap-bottom:30px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    /* 強制只吃同層 SN 字型，最後留 generic sans-serif 避免整頁沒字 */
    font-family:"SN-Regular","SN-Medium","SN-Bold", Arial, sans-serif;
    color:var(--text);
    background:#fff6ef;
  }
  header{max-width:1200px;margin:24px auto 8px;padding:0 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  header h1{margin:0 6px 0 0;font-size:24px;font-weight:900;letter-spacing:.04em;}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.controls .btn{margin-top:8px;}
  .btn{background:#222;color:#fff;border:none;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700;font-size:12pt;}
  .btn.secondary{background:#eee;color:#333}
  .input{height:38px;border-radius:10px;border:1px solid #ddd;padding:0 12px;outline:none;}
  .wrap{max-width:var(--page-width);margin:10px auto 40px;padding:0;transition:max-width .2s ease;}
  .wrap.capture-pad{padding-bottom:10px;}
  .grid{display:flex;flex-direction:column;gap:24px;align-items:center;}
  .ig-page{width:var(--page-width);background:var(--page-bg);display:flex;flex-direction:column;align-items:center;overflow:hidden;}
  .ig-title-wrap{width:100%;padding-top:var(--ig-title-top-gap);display:flex;justify-content:center;}
  .ig-title{margin:0;max-width:calc(var(--page-width) - 80px);padding:10px 50px 12px;border-radius:999px;background:#ee4d2d;color:#fff;font-family:"SN-Bold","SN-Medium","SN-Regular",sans-serif;font-size:48px;font-weight:700;line-height:1.15;text-align:center;white-space:nowrap;}
  .section-block{width:var(--section-width);background:var(--section-bg, #fff);padding:calc(var(--section-pad-y) * var(--ig-scale)) calc(var(--side-gap) * var(--ig-scale));margin-top:var(--ig-title-bottom-gap);}
  .section-grid{display:grid;grid-template-columns:repeat(3,calc(var(--card-width) * var(--ig-scale)));column-gap:calc(var(--card-gap-x) * var(--ig-scale));row-gap:calc(var(--card-gap-y) * var(--ig-scale));}
  .card{width:calc(var(--card-width) * var(--ig-scale));background:transparent;border:none;overflow:visible;position:relative;padding:0;}
  .thumb{position:relative;width:calc(var(--card-width) * var(--ig-scale));height:calc(var(--card-height) * var(--ig-scale));min-height:calc(var(--card-height) * var(--ig-scale));padding:0;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden;}
  .thumb .img-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .thumb .img-transform{position:absolute;left:50%;top:50%;height:100%;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%) scale(1);transform-origin:center center;will-change:transform;}
  .thumb img{max-width:none;max-height:none;width:auto;height:100%;object-fit:contain;display:block;margin:0;pointer-events:none;user-select:none;-webkit-user-drag:none;}
  .thumb img:not([src]){display:none;}
  .thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#bbb;font-size:18px;user-select:none;pointer-events:none;}
  .play{display:none!important;}
  .meta{background:transparent;text-align:center;padding:calc(var(--meta-gap-top) * var(--ig-scale)) 0 calc(var(--meta-gap-bottom) * var(--ig-scale));display:flex;justify-content:center;align-items:center;}
  .meta-line{display:inline-flex;justify-content:center;align-items:center;gap:1ch;line-height:1.2;white-space:nowrap;}

  .brand{
    font-family:"SN-Medium","SN-Regular","SN-Bold",sans-serif;
    font-size:calc(var(--font-size-main) * var(--ig-scale));
    font-weight:500;
    letter-spacing:0;
    margin:0;
    color:var(--text);
  }

  .share{
    font-family:"SN-Bold","SN-Medium","SN-Regular",sans-serif;
    margin:0;
    font-size:calc(var(--font-size-main) * var(--ig-scale));
    font-weight:700;
    color:var(--highlight);
    letter-spacing:0;
    white-space:nowrap;
  }

  .ig-footer{width:100%;margin-top:var(--ig-footer-gap-top);padding-bottom:var(--ig-footer-gap-bottom);display:flex;justify-content:center;}
  .ig-footer img{display:block;width:100%;height:auto;}

  .toolbar{position:absolute;left:10px;top:10px;display:flex;gap:6px;background:rgba(255,255,255,.85);padding:6px;border-radius:10px;border:1px solid #e5e5e5;z-index:2;transform:scale(var(--ig-scale));transform-origin:top left;}
  .mini{font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;}
  .mini.warn{border-color:#ffcfb8;background:#fff2ec;}
  .hidden{display:none;}
  body.capturing header,body.capturing .toolbar{display:none!important;}
  body.capturing [contenteditable]{outline:none;}
  .toast{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
  .toast .msg{background:#111;color:#fff;padding:10px 12px;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.15);font-size:14px;display:flex;align-items:center;gap:8px;opacity:.98;}
  .msg.ok{background:#13a10e;} .msg.err{background:#c72c41;} .msg.load{background:#333;}
  .msg .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);} }
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:9998;}
  .modal.open{display:flex;}
  .modal .panel{width:min(90vw,900px);background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
  .modal header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;margin:0;}
  .modal .body{padding:10px;}
  .modal .actions{display:flex;gap:8px;padding:10px;justify-content:flex-end;}
  .modal img{max-width:100%;max-height:65vh;display:block;margin:0 auto;}
  #sheetUrl, #loadGSheet{display:none!important;}
  .invisible-import{display:none !important;}

  /* === Jimmy: 隱藏指定工具列按鈕 === */
  #toggleEdit, #downloadToFolder, #clearAll{display:none!important;}
</style>
</head>
<body>
  <header>
    <h1>更多精選商品</h1>
    <div class="controls">

      <label class="btn secondary invisible-import">
        選擇「圖片資料夾」
        <input id="pickFolder" type="file" webkitdirectory directory multiple accept="image/*,.webp" style="display:none" />
      </label>

      <label class="btn secondary invisible-import">
        載入工單（.xlsx/.csv）
        <input id="pickSheet" type="file" accept=".xlsx,.xls,.csv" style="display:none" />
      </label>

      <!-- 雲端工單（保留隱藏） -->
      <input id="sheetUrl" class="input" style="min-width:280px" placeholder="貼上 Google 試算表網址（公開可讀或發佈為 CSV）" />
      <button id="loadGSheet" class="btn secondary">載入雲端工單</button>

      <button id="toggleEdit" class="btn">編輯模式：開</button>

      <label class="btn secondary" style="display:flex;align-items:center;gap:6px">
        寬度
        <input id="widthPx" class="input" type="number" min="600" step="10" value="1000" style="width:90px" />
      </label>

      <label class="btn secondary" style="display:flex;align-items:center;gap:6px">
        格數
        <input id="slotCount" class="input" type="number" min="3" step="3" value="27" style="width:80px" />
      </label>

      <label class="btn secondary" style="display:flex;align-items:center;gap:6px">
        圖片高
        <input id="imgHeight" class="input" type="number" min="100" step="10" value="244" style="width:80px" />
      </label>

      <label class="btn secondary" style="display:flex;align-items:center;gap:6px">
        字級
        <input id="fontSize" class="input" type="number" min="1" step="1" value="30" style="width:80px" />
      </label>
    

      <button id="downloadToFolder" class="btn">下載到資料夾</button> 
		  <button id="autoLoad" class="btn">上傳工單</button>

      <button id="saveDraft" class="btn secondary">下載編輯檔</button>
      <label class="btn secondary">
        讀取編輯檔
        <input id="loadDraft" type="file" accept=".json" style="display:none" />
      </label>
      <label class="btn secondary">
        上傳反修工單
        <input id="pickReworkSheet" type="file" accept=".xlsx,.xls,.csv" style="display:none" />
      </label>
      <button id="clearAll" class="btn secondary">清除內容</button>
		      <button id="downloadJPG" class="btn">下載高解析 PNG</button>

    </div>
  </header>

  <div id="canvasWrap" class="wrap">
    <div id="grid" class="grid"></div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <div id="editModal" class="modal">
    <div class="panel">
      <header>
        <strong>圖片裁切</strong>
        <button id="modalClose" class="btn secondary">關閉</button>
      </header>
      <div class="body"><img id="editImg" alt="裁切" /></div>
      <div class="actions"><button id="applyEdit" class="btn">套用</button></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>

    const SECTION_BG_COLORS = ['#f9c1b6', '#c6daf6', '#ffe7a6', '#ecdec7'];
    // 若已載入編輯檔(JSON)，則鎖住已存在的圖片編輯成果：之後匯入工單(XLSX/CSV)只更新文字，不覆蓋圖片
    let lockEditedImages = false;

    const grid = document.getElementById('grid');
    const wrap = document.getElementById('canvasWrap');
    const toast = document.getElementById('toast');

    function getCards(){ return [...grid.querySelectorAll('.card')]; }
    function getCardAt(index){ return getCards()[index] || null; }

    function getThumbParts(card){
      return {
        thumb: card.querySelector('.thumb'),
        imgWrap: card.querySelector('.img-transform'),
        img: card.querySelector('img'),
        ph: card.querySelector('.ph')
      };
    }

    function defaultImageTransform(){
      return { x:0, y:0, scale:1 };
    }

    function getImageTransform(card){
      return card._imgTransform ? { ...card._imgTransform } : defaultImageTransform();
    }

    function applyImageTransform(card){
      const { imgWrap, img, ph } = getThumbParts(card);
      if(!imgWrap || !img || !ph) return;
      applyDefaultImageFit(img);
      const t = getImageTransform(card);
      imgWrap.style.transform = `translate(-50%, -50%) translate(${t.x}px, ${t.y}px) scale(${t.scale})`;
      ph.style.display = img.getAttribute('src') ? 'none' : 'flex';
    }

    function setImageTransform(card, patch={}){
      card._imgTransform = { ...getImageTransform(card), ...patch };
      applyImageTransform(card);
    }

    function resetImageTransform(card){
      card._imgTransform = defaultImageTransform();
      applyImageTransform(card);
    }

    function wireThumbInteractions(card){
      const { thumb, imgWrap, img } = getThumbParts(card);
      if(!thumb || !imgWrap || !img || thumb.dataset.wired === '1') return;
      thumb.dataset.wired = '1';

      thumb.addEventListener('contextmenu', e => e.preventDefault());

      let mode = null;
      let startX = 0;
      let startY = 0;
      let startTransform = defaultImageTransform();

      thumb.addEventListener('wheel', e=>{
        if(!img.getAttribute('src')) return;
        e.preventDefault();
        const t = getImageTransform(card);
        const delta = -e.deltaY * 0.001;
        setImageTransform(card, { scale: Math.max(0.05, t.scale + delta) });
        saveAutoDebounced();
      }, { passive:false });

      thumb.addEventListener('mousedown', e=>{
        if(!img.getAttribute('src')) return;

        if(e.button === 0){
          mode = 'move';
        }else if(e.button === 2){
          mode = 'scale';
        }else{
          return;
        }

        e.preventDefault();
        thumb.classList.add('dragging');
        startX = e.clientX;
        startY = e.clientY;
        startTransform = getImageTransform(card);

        const onMove = ev=>{
          if(!mode) return;
          ev.preventDefault();

          if(mode === 'move'){
            setImageTransform(card, {
              x: startTransform.x + (ev.clientX - startX),
              y: startTransform.y + (ev.clientY - startY),
            });
          }else if(mode === 'scale'){
            const deltaX = ev.clientX - startX;
            setImageTransform(card, {
              scale: Math.max(0.05, startTransform.scale + deltaX * 0.01),
            });
          }
        };

        const onUp = ()=>{
          mode = null;
          thumb.classList.remove('dragging');
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          saveAutoDebounced();
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      });

      img.addEventListener('load', ()=>{
        applyDefaultImageFit(img);
        if(!card._imgTransform) card._imgTransform = defaultImageTransform();
        applyImageTransform(card);
      });
      applyImageTransform(card);
    }

    /* ===== Toast ===== */
    function showToast(text, type='ok', ms=1800){
      const el = document.createElement('div');
      el.className = `msg ${type}`;
      el.innerHTML = type==='load' ? `<span class="spin"></span>${text}` : text;
      toast.appendChild(el);
      if(type !== 'load'){ setTimeout(()=> el.remove(), ms); }
      return el;
    }

    async function imageSrcToDataURL(src){
      if(!src) return '';
      if(/^data:/.test(src)) return src;
      return await new Promise((resolve, reject)=>{
        const img = new Image();
        img.onload = ()=>{
          try{
            const c = document.createElement('canvas');
            c.width = img.naturalWidth || img.width;
            c.height = img.naturalHeight || img.height;
            const ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0);
            resolve(c.toDataURL('image/png'));
          }catch(err){
            reject(err);
          }
        };
        img.onerror = ()=> reject(new Error('圖片轉 DataURL 失敗'));
        img.src = src;
      }).catch(()=> '');
    }

    async function ensureAllImagesEmbedded(){
      const imgs = [...document.querySelectorAll('img')];
      for(const img of imgs){
        const src = img.getAttribute('src') || '';
        if(!src || /^data:/.test(src)) continue;
        const safe = await imageSrcToDataURL(src);
        if(safe) img.src = safe;
      }
    }

    function checkCustomFontsLoaded(){
      // 部分舊瀏覽器沒有 document.fonts，就直接跳過檢查
      if (!document.fonts || !document.fonts.check) return;

      const hasBold    = document.fonts.check('700 16px "SN-Bold"');
      const hasMedium  = document.fonts.check('500 16px "SN-Medium"');
      const hasRegular = document.fonts.check('400 16px "SN-Regular"');

      if (!(hasBold && hasMedium && hasRegular)){
        showToast(
          '⚠️ ShopeeNotoSans 字型未成功載入，請確認同層「fonts」內 SN-Bold / SN-Medium / SN-Regular 是否存在，且路徑與檔名正確。',
          'err',
          6000
        );
      }
    }

    if (document.fonts && document.fonts.ready){
      document.fonts.ready.then(checkCustomFontsLoaded);
    } else {
      window.addEventListener('load', checkCustomFontsLoaded);
    }

    /* ===== 檔名去副檔名（比對用） ===== */
    function fileBaseName(name){ return name.replace(/\.[^.]+$/,'').trim(); }

    function fileToDataURL(file){
      return new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = ()=> resolve(reader.result || '');
        reader.onerror = ()=> reject(reader.error || new Error('讀取圖片失敗'));
        reader.readAsDataURL(file);
      });
    }


    function sanitizeShareText(text){
      return (text || '').replace(/\s+/g,'').trim();
    }

    function applyDefaultImageFit(img){
      if(!img) return;
      img.style.maxWidth = 'none';
      img.style.maxHeight = 'none';
      img.style.width = 'auto';
      img.style.height = '100%';
      img.style.objectFit = 'contain';
      img.style.display = 'block';
      img.style.margin = '0';

    /* ===== 自動暫存：LocalStorage ===== */
    const AUTO_KEY = 'edm_autosave_v8';
    function captureDraftFromDOM(){
      const cards = getCards();
      return {
        meta: { slotCount, width: wrap.style.maxWidth || '1000px', imgHeight, fontSize: Number(getComputedStyle(document.documentElement).getPropertyValue('--font-size-main').replace('px','')) || 30, page: PAGE_NAME, version: 10, ts: Date.now() },
        items: cards.map(card=>{
          const img   = card.querySelector('img');
          const brand = card.querySelector('.brand').textContent;
          const share = sanitizeShareText(card.querySelector('.share').textContent);

        })

    }
    function saveAuto(){ try{ localStorage.setItem(AUTO_KEY, JSON.stringify(captureDraftFromDOM())); }catch(e){} }
    const saveAutoDebounced = (()=>{
      let t; return ()=>{ clearTimeout(t); t=setTimeout(saveAuto, 300); };
    })();
    function loadAuto(){
      try{
        const raw = localStorage.getItem(AUTO_KEY);
        if(!raw) return false;
        const data = JSON.parse(raw);
        if(data?.meta?.page && data.meta.page !== PAGE_NAME){
          showToast(`已載入其他頁的暫存（${data.meta.page}）`,'load',1400);
        }
        slotCount = Number(data?.meta?.slotCount || slotCount);
        imgHeight = Number(data?.meta?.imgHeight || imgHeight);
        state.bottomImageDataUrl = data?.meta?.bottomImageDataUrl || state.bottomImageDataUrl || '';
        document.getElementById('slotCount').value = slotCount;
        document.getElementById('imgHeight').value = imgHeight;
        document.documentElement.style.setProperty('--card-height', imgHeight+'px');
        const fontSize = Number(data?.meta?.fontSize || 30);
        document.getElementById('fontSize').value = fontSize;
        document.documentElement.style.setProperty('--font-size-main', fontSize+'px');
        wrap.style.maxWidth = data?.meta?.width || wrap.style.maxWidth;

        adjustGridSize(slotCount);
        (data.items||[]).forEach((it,i)=>{
          const card = getCardAt(i);
          if(!card) return;
          const img   = card.querySelector('img');
          const ph    = card.querySelector('.ph');
          const brand = card.querySelector('.brand');
          const share = card.querySelector('.share');
          if(it.img){
            img.src = it.img;
            applyDefaultImageFit(img);
            ph.style.display='none';
          } else { img.removeAttribute('src'); ph.style.display='flex'; }
          brand.textContent = it.brand || '';
          share.textContent = sanitizeShareText(it.share || '');
          card.style.setProperty('--bg', it.bgColor || (state.rowsByIndex[i]?.bgColor || '#ffbd83'));
          card._imgTransform = { ...defaultImageTransform(), ...(it.imgTransform || {}) };
          wireThumbInteractions(card);
          applyImageTransform(card);
        });
        return true;
      }catch(e){ return false; }
    }

    /* ===== 工單解析 ===== */
    function getMergedRangeMap(ws){
      const map = new Map();
      (ws['!merges'] || []).forEach(m => {
        map.set(`${m.s.r}:${m.s.c}`, m);
      });
      return map;
    }

    function findAnchorCell(arr, keyword){
      for(let r=0; r<arr.length; r++){
        const row = arr[r] || [];
        for(let c=0; c<row.length; c++){
          const text = (row[c] ?? '').toString().trim();
          if(text === keyword) return { r, c };
        }
      }
      return null;
    }

    function parseFeaturedSections(ws){
      const arr = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      const anchor = findAnchorCell(arr, PAGE_NAME);
      if(!anchor) throw new Error(`找不到「${PAGE_NAME}」座標`);

      const merges = getMergedRangeMap(ws);
      const sections = [];
      for(let r = anchor.r + 1; r < arr.length; r++){
        const row = arr[r] || [];
        for(let c = anchor.c; c < row.length; c++){
          const text = (row[c] ?? '').toString().trim();
          if(!text) continue;
          const merge = merges.get(`${r}:${c}`);
          if(!merge) continue;
          const isHorizontal = merge.s.r === r && merge.s.c === c && merge.e.c > merge.s.c;
          if(!isHorizontal) continue;
          if(text === PAGE_NAME) continue;
          sections.push({
            title: text,
            startRow: r,
            startCol: c,
            endCol: Math.min(merge.e.c, c + 2),
            sectionIndex: sections.length,
          });
          break;
        }
      }

      if(!sections.length) throw new Error('找不到區塊起始（掛標/合併儲存格）');

      const out = [];
      const normalizedSections = [];
      let seq = 1;
      sections.forEach((section, idx) => {
        const endRow = (sections[idx + 1]?.startRow ?? arr.length) - 1;
        const bgColor = SECTION_BG_COLORS[idx % SECTION_BG_COLORS.length];
        const rowStartIndex = out.length;
        let rowCount = 0;
        for(let r = section.startRow + 1; r <= endRow; r += 2){
          const nameRow = arr[r] || [];
          const copyRow = arr[r + 1] || [];
          let rowHasData = false;
          for(let c = section.startCol; c <= section.endCol; c++){
            const item = (nameRow[c] ?? '').toString().replace(/\s+/g, ' ').trim();
            const copy = (copyRow[c] ?? '').toString().replace(/\s+/g, '').trim();
            if(item || copy){
              rowHasData = true;
              out.push({
                item,
                copy,
                seq,
                sectionIndex: idx,
                sectionTitle: section.title,
                bgColor,
              });
              seq++;
            }
          }
          if(rowHasData) rowCount++;
          if(!rowHasData && r + 1 > endRow) break;
        }
        normalizedSections.push({
          sectionIndex: idx,
          sectionTitle: section.title,
          bgColor,
          startItemIndex: rowStartIndex,
          itemCount: out.length - rowStartIndex,
          rowCount,
        });
      });

      state.sections = normalizedSections.filter(s => s.itemCount > 0);
      return out;
    }

    /* ===== 建卡 / 調整格數 ===== */
    function createCard({url, item='', c1='', idx, bgColor=''}) {
      const card = document.createElement('article');
      card.className = 'card';
      card.dataset.idx = idx;

      card.innerHTML = `
        <div class="thumb">
          <div class="toolbar ${editMode?'':'hidden'}">
            <button class="mini crop">裁切</button>
            <button class="mini change">換圖</button>
            <button class="mini warn revert">還原</button>
          </div>
          <div class="img-stage">
            <div class="ph">圖片 ${idx+1}</div>
            <div class="img-transform"><img alt=""></div>
          </div>
          
          <div class="play"><span class="tri">▶</span></div>
          <input type="file" accept="image/*,.webp" class="hidden picker" />
        </div>
        <div class="meta">
          <div class="meta-line">
            <span class="brand" ${editMode?'contenteditable':''}></span>
            <span class="share" ${editMode?'contenteditable':''}></span>
          </div>
        </div>
      `;

      const img = card.querySelector('img');
      const ph  = card.querySelector('.ph');
      const brand = card.querySelector('.brand');
      const share = card.querySelector('.share');
      const picker = card.querySelector('.picker');

      if(url){
        img.src = url;
        applyDefaultImageFit(img);
        ph.style.display='none';
      }
      card._imgTransform = defaultImageTransform();
      brand.textContent = item || '';
      share.textContent = sanitizeShareText(c1 || '');
      wireThumbInteractions(card);
      applyImageTransform(card);

      // 初始狀態記錄（給「還原」用）
      state.original[idx] = { url: url || '', brand: brand.textContent, share: sanitizeShareText(share.textContent), bgColor: bgColor || '', imgTransform: defaultImageTransform() };
      if(bgColor){ card.style.setProperty('--bg', bgColor); }

      card.querySelector('.change').addEventListener('click', ()=> picker.click());
      picker.addEventListener('change', async e=>{
        const f = e.target.files?.[0]; if(!f) return;
        try{
          img.src = await fileToDataURL(f);
          applyDefaultImageFit(img);
          ph.style.display = 'none';
          resetImageTransform(card);
          applyImageTransform(card);
          saveAutoDebounced();
        }catch(err){
          console.error(err);
          showToast('換圖失敗','err');
        }
      });

      share.addEventListener('input', ()=>{
        const cleaned = sanitizeShareText(share.textContent);
        if(share.textContent !== cleaned) share.textContent = cleaned;
      });

      card.querySelector('.crop').addEventListener('click', ()=>{
        if(!img.getAttribute('src')){ showToast('請先選一張圖片','err'); return; }
        openCropper(img);
      });

      card.querySelector('.revert').addEventListener('click', ()=>{
        const o = state.original[idx]||{};
        if(o.url){
          img.src = o.url;
          applyDefaultImageFit(img);
          ph.style.display='none';
        }
        else { img.removeAttribute('src'); ph.style.display='flex'; }
        brand.textContent = o.brand??'';
        share.textContent = sanitizeShareText(o.share??'');
        card.style.setProperty('--bg', o.bgColor || '#ffbd83');
        card._imgTransform = { ...defaultImageTransform(), ...((o.imgTransform)||{}) };
        applyImageTransform(card);
        saveAutoDebounced();
      });

      return card;
    }
    function createSectionBlock(section, sectionCards){
      const pageEl = document.createElement('section');
      pageEl.className = 'ig-page';
      pageEl.dataset.sectionIndex = section.sectionIndex ?? '';
      pageEl.style.setProperty('--section-bg', section.bgColor || '#fff');

      const titleWrap = document.createElement('div');
      titleWrap.className = 'ig-title-wrap';
      const titleEl = document.createElement('h2');
      titleEl.className = 'ig-title';
      titleEl.textContent = section.sectionTitle || PAGE_NAME;
      titleWrap.appendChild(titleEl);

      const sectionEl = document.createElement('div');
      sectionEl.className = 'section-block';
      sectionEl.style.setProperty('--section-bg', section.bgColor || '#fff');

      const sectionGrid = document.createElement('div');
      sectionGrid.className = 'section-grid';
      sectionCards.forEach(card => sectionGrid.appendChild(card));
      sectionEl.appendChild(sectionGrid);

      const footer = document.createElement('div');
      footer.className = 'ig-footer';
      footer.innerHTML = state.bottomImageDataUrl ? `<img src="${state.bottomImageDataUrl}" alt="吸底圖">` : '';

      pageEl.appendChild(titleWrap);
      pageEl.appendChild(sectionEl);
      pageEl.appendChild(footer);
      return pageEl;
    }

    function renderSectionsLayout(){
      const existingCards = getCards();
      const cardMap = new Map(existingCards.map(card => [Number(card.dataset.idx), card]));
      grid.innerHTML = '';

      const sections = (state.sections && state.sections.length)
        ? state.sections
        : [{ sectionIndex: 0, sectionTitle: PAGE_NAME, bgColor: SECTION_BG_COLORS[0], startItemIndex: 0, itemCount: slotCount }];

      sections.forEach((section, sidx) => {
        const start = Number(section.startItemIndex || 0);
        const count = Number(section.itemCount || 0);
        const cards = [];
        for(let i=start; i<start+count; i++){
          let card = cardMap.get(i);
          if(!card){
            const row = state.rowsByIndex[i] || { item:'', copy:'', bgColor: section.bgColor || SECTION_BG_COLORS[sidx % SECTION_BG_COLORS.length] };
            card = createCard({ url:'', item: row.item, c1: row.copy, idx: i, bgColor: row.bgColor || section.bgColor });
          }
          const row = state.rowsByIndex[i] || {};
          card.style.setProperty('--bg', row.bgColor || section.bgColor || SECTION_BG_COLORS[sidx % SECTION_BG_COLORS.length]);
          cards.push(card);
        }
        if(cards.length){
          grid.appendChild(createSectionBlock(section, cards));
        }
      });
    }

    function adjustGridSize(newCount){
      slotCount = newCount;
      renderSectionsLayout();
    }
    function applyRowsToDOM(){
      renderSectionsLayout();
      getCards().forEach((card,i)=>{
        const row = state.rowsByIndex[i] || { item:'', copy:'', bgColor:'' };
        card.querySelector('.brand').textContent = row.item || '';
        card.querySelector('.share').textContent = sanitizeShareText(row.copy || '');
        card.style.setProperty('--bg', row.bgColor || '#ffbd83');
        wireThumbInteractions(card);
        applyImageTransform(card);
        const sectionEl = card.closest('.section-block');
        if(sectionEl) sectionEl.style.setProperty('--section-bg', row.bgColor || '#ffbd83');
      });
      saveAutoDebounced();
    }
    function setEditModeUI(){
      getCards().forEach(card=>{
        const tb = card.querySelector('.toolbar');
        const brand = card.querySelector('.brand');
        const share = card.querySelector('.share');
        const row = state.rowsByIndex[Number(card.dataset.idx)] || {};
        if(row.bgColor){ card.style.setProperty('--bg', row.bgColor); }
        tb.classList.toggle('hidden', !editMode);
        brand.toggleAttribute('contenteditable', editMode);
        share.toggleAttribute('contenteditable', editMode);
      });

    /* ===== JPG 匯出（每區一張，寬 1200 / 高自動） ===== */
    function getSectionGroups(){
      const cards = getCards();
      const groups = [];
      const sections = state.sections?.length ? state.sections : [];

      if(sections.length){
        sections.forEach((section, idx) => {
          const sectionCards = cards.slice(section.startItemIndex, section.startItemIndex + section.itemCount);
          if(sectionCards.length){
            groups.push({
              sectionIndex: section.sectionIndex ?? idx,
              sectionNumber: idx + 1,
              sectionTitle: section.sectionTitle || PAGE_NAME,
              bgColor: section.bgColor || SECTION_BG_COLORS[idx % SECTION_BG_COLORS.length],
              cards: sectionCards,
              rowCount: section.rowCount || Math.ceil(sectionCards.length / 3),
            });
          }
        });
        return groups;
      }

      let current = null;
      cards.forEach((card, idx) => {
        const row = state.rowsByIndex[idx] || {};
        if(!current || current.sectionIndex !== row.sectionIndex){
          current = {
            sectionIndex: row.sectionIndex,
            sectionNumber: groups.length + 1,
            sectionTitle: row.sectionTitle || PAGE_NAME,
            bgColor: row.bgColor || SECTION_BG_COLORS[groups.length % SECTION_BG_COLORS.length],
            cards: [],
            rowCount: 0,
          };
          groups.push(current);
        }
        current.cards.push(card);
      });
      groups.forEach(g => { g.rowCount = Math.ceil(g.cards.length / 3); });
      return groups.filter(g => g.cards.length);
    }

    async function canvasToBlobSafe(canvas){
      return await new Promise((resolve, reject)=>{
        try{
          canvas.toBlob((blob)=>{
            if(blob) resolve(blob);
            else reject(new Error('Canvas 轉檔失敗'));
          }, 'image/png');
        }catch(err){
          reject(err);
        }
      });
    }

    async function canvasToBlob(canvas, backgroundColor){
      return await canvasToBlobSafe(canvas);
    }


    function prepareExportNode(node){
      const clone = node.cloneNode(true);
      clone.querySelectorAll('.toolbar').forEach(el=>el.remove());
      clone.querySelectorAll('.picker').forEach(el=>el.remove());
      clone.querySelectorAll('.img-hint').forEach(el=>el.remove());
      clone.querySelectorAll('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));
      return clone;
    }

    async function renderNodeToBlob(node, backgroundColor){
      const exportWrap = document.createElement('div');
      exportWrap.style.position = 'fixed';
      exportWrap.style.left = '-99999px';
      exportWrap.style.top = '0';
      exportWrap.style.margin = '0';
      exportWrap.style.padding = '0';
      exportWrap.style.background = backgroundColor || '#fff';
      exportWrap.style.boxSizing = 'border-box';

      const clone = prepareExportNode(node);
      exportWrap.appendChild(clone);
      document.body.appendChild(exportWrap);

      await new Promise(resolve => requestAnimationFrame(() => resolve()));
      await new Promise(resolve => requestAnimationFrame(() => resolve()));

      const rect = clone.getBoundingClientRect();
      const canvas = await html2canvas(clone, {
        useCORS:false,
        allowTaint:false,
        backgroundColor: backgroundColor || '#fff',
        scale:2,
        width: Math.ceil(rect.width),
        height: Math.ceil(rect.height),
        windowWidth: Math.ceil(rect.width),
        windowHeight: Math.ceil(rect.height)
      });
      exportWrap.remove();
      return canvasToBlob(canvas, backgroundColor || '#fff');
    }

    async function renderIGSectionToBlob(group){
      const pageEl = document.querySelector(`.ig-page[data-section-index="${group.sectionIndex}"]`);
      if(!pageEl) throw new Error('找不到 IG 區塊節點');
      return renderNodeToBlob(pageEl, '#f8e8d9');
    }

    async function renderBlockSectionToBlob(group){
      const pageEl = document.querySelector(`.ig-page[data-section-index="${group.sectionIndex}"]`);
      const sectionEl = pageEl?.querySelector('.section-block');
      if(!sectionEl) throw new Error('找不到區塊節點');
      const bg = getComputedStyle(sectionEl).getPropertyValue('--section-bg').trim() || group.bgColor || '#fff';
      return renderNodeToBlob(sectionEl, bg);
    }

    async function downloadBlob(blob, fileName){
      const a = document.createElement('a');
      a.download = fileName;
      a.href = URL.createObjectURL(blob);
      a.click();
      setTimeout(()=> URL.revokeObjectURL(a.href), 1000);
    }

    async function captureJPGByPages(){
      await ensureAllImagesEmbedded();
      const groups = getSectionGroups();
      const total = groups.length;
      if (!total){ showToast('沒有可下載的分區內容','err'); return; }

      document.body.classList.add('capturing');
      wrap.classList.add('capture-pad');

      try{
        for (let i = 0; i < total; i++){
          const igBlob = await renderIGSectionToBlob(groups[i]);
          await downloadBlob(igBlob, `更多精選商品_IG圖_${String(i + 1).padStart(2, '0')}.png`);

          const blockBlob = await renderBlockSectionToBlob(groups[i]);
          await downloadBlob(blockBlob, `更多精選商品_區塊圖_${String(i + 1).padStart(2, '0')}.png`);
        }
        showToast(`已依序下載 ${total} 張 IG 圖 + ${total} 張區塊圖`,'ok');
      }finally{
        wrap.classList.remove('capture-pad');
        document.body.classList.remove('capturing');
      }
    }

    /* ===== 下載到資料夾（每區另存） ===== */
    async function downloadJPGToFolder(){
      const groups = getSectionGroups();
      const total = groups.length;
      if (!total){ showToast('沒有可下載的分區內容','err'); return; }

      const hasFSP = 'showSaveFilePicker' in window;
      document.body.classList.add('capturing');
      wrap.classList.add('capture-pad');

      try{
        for (let i = 0; i < total; i++){
          const filesToSave = [
            { blob: await renderIGSectionToBlob(groups[i]), name: `更多精選商品_IG圖_${String(i + 1).padStart(2, '0')}.png` },
            { blob: await renderBlockSectionToBlob(groups[i]), name: `更多精選商品_區塊圖_${String(i + 1).padStart(2, '0')}.png` }
          ];

          for (const file of filesToSave){
            if (hasFSP){
              try{
                const handle = await window.showSaveFilePicker({
                  suggestedName: file.name,
                  types: [{ description:'PNG Image', accept:{ 'image/png':['.png'] } }]
                });
                const writable = await handle.createWritable();
                await writable.write(file.blob);
                await writable.close();
              }catch(e){
                if(e?.name==='AbortError'){
                  showToast('已取消儲存','load',1600);
                  return;
                }else{
                  await downloadBlob(file.blob, file.name);
                }
              }
            }else{
              await downloadBlob(file.blob, file.name);
            }
          }
        }
        showToast(`已完成依序儲存/下載 ${total} 張 IG 圖 + ${total} 張區塊圖`,'ok');
      }catch(err){
        console.error(err);
        showToast('發生錯誤，改用預設分區下載','load',1600);
        await captureJPGByPages();
      }finally{
        wrap.classList.remove('capture-pad');
        document.body.classList.remove('capturing');
      }
    }

    /* ===== 裁切彈窗 ===== */
    let cropper = null, targetImgElem = null;
    const modal = document.getElementById('editModal');
    const editImg = document.getElementById('editImg');

    function openCropper(imgElem){
      targetImgElem = imgElem;
      editImg.src = imgElem.src || '';
      modal.classList.add('open');
      cropper?.destroy?.();
      cropper = new Cropper(editImg, { viewMode:1, autoCropArea:1, movable:true, zoomable:true, scalable:true });

    document.getElementById('applyEdit').addEventListener('click', ()=>{

    /* ===== 讀工單（本機 / 雲端） ===== */
    async function handleSheetFile(file){
      try{
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: 'array' });
        const pickedName = wb.SheetNames[0];
        const ws = wb.Sheets[pickedName];
        state.rowsByIndex = parseFeaturedSections(ws);

        const countFromSheet  = state.rowsByIndex.length;

        if (!lockEditedImages){
          if (countFromSheet !== slotCount){
            slotCount = countFromSheet;
            document.getElementById('slotCount').value = slotCount;
            adjustGridSize(slotCount);
          }
        }else{
          if (countFromSheet > slotCount){
            slotCount = countFromSheet;
            document.getElementById('slotCount').value = slotCount;
            adjustGridSize(slotCount);
          }
        }
        applyRowsToDOM();
        showToast(`本機工單載入成功（使用頁籤：${pickedName}，共 ${countFromSheet} 格）`,'ok');
        saveAutoDebounced();
      }catch(e){
        console.error(e);
        showToast(`本機工單載入失敗：${e?.message || '格式不符'}`,'err', 2600);
      }
    }

    function parseGSheetUrl(u){
      try{
        const url = new URL(u.trim());
        if(!/docs\.google\.com\/spreadsheets/.test(url.hostname + url.pathname)) return null;
        const id = url.pathname.match(/\/spreadsheets\/d\/([^\/]+)/)?.[1];
        const gidFromQuery = url.searchParams.get('gid');
        const gidFromHash  = url.hash.match(/gid=(\d+)/)?.[1];
        const gid = gidFromQuery || gidFromHash || '0';
        if(!id) return null;
        return `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&id=${id}&gid=${gid}`;
      }catch{ return null; }
    }
    async function handleGSheetUrl(inputUrl){
      const csvUrl = parseGSheetUrl(inputUrl);
      if(!csvUrl){ showToast('請貼 Google 試算表網址','err'); return; }
      const loading = showToast('讀取雲端工單中…','load');
      try{
        const res = await fetch(csvUrl);
        if(!res.ok) throw new Error('權限或連線錯誤');
        const text = await res.text();
        const wb = XLSX.read(text, { type: 'string' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        state.rowsByIndex = parseFeaturedSections(ws);

        const countFromSheet  = state.rowsByIndex.length;
        if (!lockEditedImages){
          if (countFromSheet !== slotCount){
            slotCount = countFromSheet;
            document.getElementById('slotCount').value = slotCount;
            adjustGridSize(slotCount);
          }
        }else{
          if (countFromSheet > slotCount){
            slotCount = countFromSheet;
            document.getElementById('slotCount').value = slotCount;
            adjustGridSize(slotCount);
          }
        }
        applyRowsToDOM();
        loading.remove();
        showToast(`雲端工單載入成功（共 ${countFromSheet} 格）`,'ok');
        saveAutoDebounced();
      }catch(e){
        loading.remove();
        console.error(e);
        showToast('雲端工單載入失敗：新版規則需要保留合併欄位資訊，請優先使用 .xlsx','err', 3200);
      }
    }

    /* ===== 圖片載入規則 ===== */
    function extractSequenceNumber(name){
      const base = fileBaseName(name);
      // 檔名不限前後文字，只抓其中的數字編號：
      // 例如 產品1 / 圖片2 / A_001 / 商品002_final 都會抓到 1 / 2 / 1 / 2
      const nums = base.match(/\d+/g);
      if(!nums || !nums.length) return null;
      // 預設取第一段數字作為流水號，前導 0 會自動正規化：001 -> 1
      return Number(nums[0]);
    }

    function isImageFile(file){
      const name = (file?.name || '').toLowerCase();
      const type = (file?.type || '').toLowerCase();
      return (
        type.startsWith('image/') ||
        /\.(jpg|jpeg|png|webp)$/i.test(name)
      );
    }

    async function handleFolderFiles(fileList){
      const files = [...fileList].filter(f=> isImageFile(f));
      if (!files.length){
        showToast('沒有可用的圖片','err');
        return;
      }

      const seqToUrl = new Map();
      const duplicateSeq = new Set();
      for (const f of files){
        const seq = extractSequenceNumber(f.name);
        if(seq == null) continue;
        const url = await fileToDataURL(f);
        if (seqToUrl.has(seq)){
          duplicateSeq.add(seq);
        }else{
          seqToUrl.set(seq, url);
        }
      }

      let hit = 0;
      const misses = [];

      getCards().forEach((card,i)=>{
        const row = state.rowsByIndex[i] || { item:'', copy:'', seq:null };
        const img = card.querySelector('img');
        const ph  = card.querySelector('.ph');
        const seq = row.seq;

        if (seq != null && seqToUrl.has(seq)){
          const hasImg = !!img.getAttribute('src');
          if (!lockEditedImages || !hasImg){
            img.src = seqToUrl.get(seq);
            applyDefaultImageFit(img);
            ph.style.display = 'none';
            resetImageTransform(card);
            applyImageTransform(card);
            hit++;
          }
        }else{
          if(!img.getAttribute('src')){
            img.removeAttribute('src');
            ph.style.display = 'flex';
          }
          misses.push(seq != null ? `流水號${seq}` : `#${i+1}`);
        }
      });

      showToast(`已匹配 ${hit} 張（只看檔名中的數字編號）`,'ok');
      if (duplicateSeq.size){
        showToast(`偵測到重複流水號（只採第一個）：${[...duplicateSeq].slice(0,6).join('、')}${duplicateSeq.size>6?'…':''}`,'load',5000);
      }
      if (misses.length){
        showToast(`未找到對應圖片：${misses.slice(0,6).join('、')}${misses.length>6?'…':''}`,'load',5000);
      }

      saveAutoDebounced();
    }


    
    async function findBottomImageInRoot(root){
      try{
        for await (const [name, handle] of root.entries()){
          if(handle.kind === 'directory' && name === 'assets'){
            for await (const [subName, subHandle] of handle.entries()){
              if(subHandle.kind === 'directory' && subName === 'images'){
                for await (const [imgName, imgHandle] of subHandle.entries()){
                  if(imgHandle.kind === 'file' && imgName === '吸底.png'){
                    const f = await imgHandle.getFile();
                    state.bottomImageDataUrl = await fileToDataURL(f);
                    renderSectionsLayout();
                    return true;
                  }
                }
              }
            }
          }
        }
      }catch(err){
        console.error(err);
      }
      return false;
    }

/* ===== 自動載入（同層） ===== */
    async function autoLoad(){
      if(!('showDirectoryPicker' in window)){ showToast('瀏覽器不支援同層自動讀取','err'); return; }
      try{
        const root = await window.showDirectoryPicker();

        let sheetHandle = null;
        const candidates = [];
        for await (const [name, handle] of root.entries()){
          if(handle.kind==='file' && /\.(xlsx|xls|csv)$/i.test(name)){
            candidates.push({name, handle});
          }
        }
        if(candidates.length){
          candidates.sort((a,b)=>{
            const aHit = a.name.toLowerCase().includes(PAGE_NAME_NORM) ? 0 : 1;
            const bHit = b.name.toLowerCase().includes(PAGE_NAME_NORM) ? 0 : 1;
            return aHit - bHit || a.name.localeCompare(b.name,'zh-Hant');
          });
          sheetHandle = candidates[0].handle;
          const f = await sheetHandle.getFile();
          await handleSheetFile(f);
        }else{
          showToast('未找到工單檔（.xlsx/.csv）','load',1600);
        }

        const imgs = [];
        for await (const [, handle] of root.entries()){
          if(handle.kind==='file'){
            const f = await handle.getFile();
            if(isImageFile(f)) imgs.push(f);
          }
        }

        if(!imgs.length){
          showToast('未找到圖片（與工單同層，支援 JPG / PNG / WEBP）','err');
        }else{
          await handleFolderFiles(imgs);
        }

        const bottomOk = await findBottomImageInRoot(root);
        if(!bottomOk){
          showToast('未找到吸底圖：請確認檔案位於 ./assets/images/吸底.png','load',5000);
        }

        showToast('自動載入完成','ok');
        saveAutoDebounced();
      }catch(e){
        if(e?.name!=='AbortError') showToast('自動載入失敗','err');
      }
    }

    /* ===== 暫存 / 讀取暫存 / 清除 ===== */
    async function imageToDataURL(src){
      if(!src) return '';
      if(/^data:/.test(src)) return src; // 已經是 DataURL
      return new Promise(resolve=>{
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = ()=>{
          const c = document.createElement('canvas');
          c.width = img.width; c.height = img.height;
          const ctx = c.getContext('2d');
          ctx.drawImage(img,0,0);
          resolve(c.toDataURL('image/png'));
        };
        img.onerror = ()=> resolve('');
        img.src = src;
      });
    }

    // 下載編輯檔：使用 DataURL 內嵌圖片（方案 A）
    async function saveDraft(){
      await ensureAllImagesEmbedded();
      const cards = getCards();
      const items = [];
      let idx = 0;
      for (const card of cards){
        const img = card.querySelector('img');
        const brand = card.querySelector('.brand').textContent;
        const share = sanitizeShareText(card.querySelector('.share').textContent);
        const src = img.getAttribute('src') || '';
        const dataUrl = await imageToDataURL(src);  // 這裡確保裁切後 / 外部圖都被轉成 DataURL 存進 JSON
        const bgColor = getComputedStyle(card).getPropertyValue('--bg').trim() || '';
        const imgTransform = getImageTransform(card);
        items.push({ img: dataUrl, brand, share, bgColor, imgTransform });

        // 也同步更新 original，讓載入後「還原」是回到編輯檔初始狀態
        state.original[idx] = { url: dataUrl || '', brand, share, bgColor, imgTransform };
        idx++;
      }
      const blob = new Blob([JSON.stringify({
        meta:{ slotCount, width: wrap.style.maxWidth || '1000px', imgHeight, fontSize: Number(getComputedStyle(document.documentElement).getPropertyValue('--font-size-main').replace('px','')) || 30, page: PAGE_NAME, version:10 },
        items
      })], {type:'application/json'});
      const a = document.createElement('a');
      a.download = 'edm_draft.json';
      a.href = URL.createObjectURL(blob);
      a.click();
      showToast('已下載暫存檔（內含圖片 DataURL）','ok');
    }

    // 載入編輯檔：直接吃 DataURL，並更新 original
    function loadDraft(file){
      const r = new FileReader();
      r.onload = ()=>{
        try{
          const data = JSON.parse(r.result);
          slotCount = Number(data?.meta?.slotCount || 27);
          imgHeight = Number(data?.meta?.imgHeight || 280);
          document.getElementById('slotCount').value = slotCount;
          document.getElementById('imgHeight').value = imgHeight;
          document.documentElement.style.setProperty('--card-height', imgHeight+'px');
          const fontSize = Number(data?.meta?.fontSize || 30);
          document.getElementById('fontSize').value = fontSize;
          document.documentElement.style.setProperty('--font-size-main', fontSize+'px');
          wrap.style.maxWidth = data?.meta?.width || '1000px';

          adjustGridSize(slotCount);
          state.original = {}; // 重建 original，對齊載入的內容

          (data.items||[]).forEach((it,i)=>{
            const card = getCardAt(i);
            if(!card) return;
            const img   = card.querySelector('img');
            const ph    = card.querySelector('.ph');
            const brand = card.querySelector('.brand');
            const share = card.querySelector('.share');
            if(it.img){
              img.src = it.img;
              applyDefaultImageFit(img);
              ph.style.display='none';
            } else { img.removeAttribute('src'); ph.style.display='flex'; }
            brand.textContent = it.brand || '';
            share.textContent = sanitizeShareText(it.share || '');
            card.style.setProperty('--bg', it.bgColor || (state.rowsByIndex[i]?.bgColor || '#ffbd83'));
            card._imgTransform = { ...defaultImageTransform(), ...(it.imgTransform || {}) };
            wireThumbInteractions(card);
            applyImageTransform(card);

            // 以 JSON 裡的狀態當作「還原」基準
            state.original[i] = {
              url: it.img || '',
              brand: it.brand || '',
              share: it.share || '',
              bgColor: it.bgColor || (state.rowsByIndex[i]?.bgColor || ''),
              imgTransform: { ...defaultImageTransform(), ...(it.imgTransform || {}) }
            };
          });
          showToast('暫存已載入（含圖片 DataURL）','ok');
          lockEditedImages = true; // 鎖住圖片編輯成果，避免後續匯入工單/圖片時覆蓋
          saveAutoDebounced();
        }catch(e){ 
          console.error(e);
          showToast('暫存檔格式錯誤','err'); 
        }
      };
      r.readAsText(file);
    }

    function clearAll(){
      if(!confirm('確定要清除內容嗎？這會移除所有圖片與文字，並清除自動暫存。')) return;
      getCards().forEach(card=>{
        const img = card.querySelector('img');
        const ph  = card.querySelector('.ph');
        const brand = card.querySelector('.brand');
        const share = card.querySelector('.share');
        img.removeAttribute('src');
        ph.style.display = 'flex';
        brand.textContent = '';
        share.textContent = '';
      });
      state.images = [];
      state.rowsByIndex = [];
      state.original = {};
      try{ localStorage.removeItem(AUTO_KEY); }catch(e){}
      showToast('內容已清除','ok');
      lockEditedImages = false;
    }

    /* ===== 事件綁定 ===== */
    document.getElementById('autoLoad').addEventListener('click', autoLoad);
    document.getElementById('pickFolder').addEventListener('change', e=> e.target.files.length && handleFolderFiles(e.target.files));
    document.getElementById('pickSheet').addEventListener('change', e=> e.target.files[0] && handleSheetFile(e.target.files[0]));
    document.getElementById('pickReworkSheet').addEventListener('change', async e=>{
      if(!e.target.files[0]) return;
      // 反修工單：只更新文字，不動圖片/裁切成果；同時避免縮減格數誤刪已編輯內容
      const prevLock = lockEditedImages;
      lockEditedImages = true;
      await handleSheetFile(e.target.files[0]);
      lockEditedImages = prevLock;
      showToast('反修工單文字已更新（圖片不變）','ok');
      e.target.value='';
    });
    document.getElementById('loadGSheet').addEventListener('click', ()=>{
      const u = document.getElementById('sheetUrl').value.trim();
      if(u) handleGSheetUrl(u); else showToast('請先貼上 Google 試算表網址','err');
    });

    document.getElementById('toggleEdit').addEventListener('click', ()=>{
      editMode = !editMode;
      document.getElementById('toggleEdit').textContent = `編輯模式：${editMode?'開':'關'}`;
      setEditModeUI();
      saveAutoDebounced();
    });
    document.getElementById('widthPx').addEventListener('input', e=>{
      const v = Math.max(600, Number(e.target.value||1000));
      wrap.style.maxWidth = v + 'px';
      saveAutoDebounced();
    });
    document.getElementById('slotCount').addEventListener('input', e=>{
      const v = Math.max(3, Math.floor(Number(e.target.value||27)/3)*3);
      e.target.value = v;
      adjustGridSize(v);
      setEditModeUI();
      saveAutoDebounced();
    });
    document.getElementById('imgHeight').addEventListener('input', e=>{
      imgHeight = Math.max(100, Number(e.target.value||244));
      document.documentElement.style.setProperty('--card-height', imgHeight+'px');
      saveAutoDebounced();
    });
    document.getElementById('fontSize').addEventListener('input', e=>{
      const v = Math.max(1, Number(e.target.value||30));
      document.documentElement.style.setProperty('--font-size-main', v+'px');
      saveAutoDebounced();
    });

    document.getElementById('downloadJPG').addEventListener('click', async ()=>{
      try{
        await captureJPGByPages();
      }catch(err){
        console.error(err);
        showToast('下載 JPG 失敗：' + (err?.message || '未知錯誤'), 'err', 5000);
      }
    });
    document.getElementById('downloadToFolder').addEventListener('click', downloadJPGToFolder);

    document.getElementById('saveDraft').addEventListener('click', saveDraft);
    document.getElementById('loadDraft').addEventListener('change', e=> e.target.files[0] && loadDraft(e.target.files[0]));
    document.getElementById('clearAll').addEventListener('click', clearAll);

    grid.addEventListener('input', e=>{
      if(e.target.matches('.brand, .share')) saveAutoDebounced();
    });

    window.addEventListener('dragover', e=> e.preventDefault());
    window.addEventListener('drop', e=>{
      e.preventDefault();
      const files = [...e.dataTransfer.files];
      const imgs = files.filter(f=> isImageFile(f));
      const sheet = files.find(f=> /\.(xlsx|xls|csv)$/i.test(f.name));
      if(sheet) handleSheetFile(sheet);
      if(imgs.length) handleFolderFiles(imgs);
    });

    wrap.style.maxWidth = '1000px';
    adjustGridSize(slotCount);
    document.documentElement.style.setProperty('--card-height', imgHeight+'px');
    document.getElementById('fontSize').value = Number(getComputedStyle(document.documentElement).getPropertyValue('--font-size-main').replace('px','')) || 30;
    loadAuto();
    setEditModeUI();
  </script>
